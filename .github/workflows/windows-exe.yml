name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calculator engine
        run: python -m unittest discover -s tests -v
      - name: Build using Windows batch script without Python Launcher
        shell: cmd
        env:
          CALCULATOR_BUILD_CI: '1'
        run: |
          where python
          python -c "import pathlib; pathlib.Path('build-ci.bat').write_text(pathlib.Path('build-windows.bat').read_text().replace('call :detect_python \"py -3\"', 'rem Python Launcher intentionally unavailable in this test'))"
          call build-ci.bat
      - name: Smoke test packaged desktop application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Calculator.exe -ArgumentList '--smoke-test' -PassThru
          try {
            if (-not $process.WaitForExit(60000)) { throw "Packaged smoke test timed out." }
            if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - name: Upload Calculator.exe
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Windows
          path: dist/Calculator.exe
          if-no-files-found: error
          retention-days: 90
