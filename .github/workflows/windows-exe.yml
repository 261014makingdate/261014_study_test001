name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calculator engine
        run: python -m unittest discover -s tests -v
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.20.0
      - name: Build single executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name Calculator desktop.py
      - name: Smoke test packaged desktop application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Calculator.exe -PassThru
          try {
            $opened = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Calculator exited before opening a window." }
              if ($process.MainWindowHandle -ne 0) { $opened = $true; break }
            }
            if (-not $opened) { throw "Calculator window did not open within 30 seconds." }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - name: Upload Calculator.exe
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Windows
          path: dist/Calculator.exe
          if-no-files-found: error
          retention-days: 90
